<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaña · The Field Forge</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/forja.css">
  <script src="js/comun.js"></script>
  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="js/reglas/dados.js"></script>
  <script src="js/reglas/reglas5e.js"></script>
  <script src="js/reglas/npc.js"></script>
  <script src="js/reglas/bestiario.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/particulas.js"></script>
  <script src="js/peticiones.js"></script>
</head>
<body>
  <header class="barra">
    <nav class="envoltura barra__in" aria-label="Principal">
      <a class="barra__marca" href="./" aria-label="The Field Forge, inicio"><span class="logo"></span></a>
      <div class="barra__nav" data-nav></div>
      <div class="barra__acciones">
        <button class="boton boton--fantasma boton--icono" type="button" data-icono-tema></button>
        <div data-menu-usuario></div>
      </div>
    </nav>
  </header>

  <section class="portada-camp" data-portada hidden>
    <div class="escena__ilus" aria-hidden="true"><img src="img/ilustracion.svg" alt=""></div>
    <div class="escena__velo" aria-hidden="true"></div>
    <canvas class="escena__chispas" data-chispas="ancho" data-densidad=".45" aria-hidden="true"></canvas>
    <div class="envoltura portada-camp__in">
      <a class="miga" href="campanas.html" data-miga>Mis campañas</a>
      <div class="portada-camp__fila">
        <div>
          <h1 data-titulo></h1>
          <p class="portada-camp__amb" data-amb></p>
        </div>
        <div class="cabecera__acciones" data-acciones-portada></div>
      </div>
      <div class="cifras" data-cifras></div>
    </div>
  </section>

  <nav class="pestanas-camp" aria-label="Secciones de la campaña" data-pestanas-caja hidden>
    <div class="envoltura pestanas-camp__in" role="tablist" data-pestanas></div>
  </nav>

  <div class="envoltura pets-caja"><section class="pets" data-pets aria-label="Peticiones de los jugadores" hidden></section></div>
  <main class="envoltura panel-camp" data-contenido aria-live="polite"></main>

  <!-- Ver un personaje -->
  <dialog class="hoja hoja--ancha" id="ver-ficha" aria-label="Ficha">
    <div class="hoja__in">
      <div class="hoja__cab"><span></span><button class="boton boton--fantasma boton--icono" type="button" data-cerrar aria-label="Cerrar"></button></div>
      <div data-cuerpo></div>
      <div class="hoja__pie" data-pie></div>
    </div>
  </dialog>

  <!-- Editar personaje -->
  <dialog class="hoja" id="editar-ficha" aria-labelledby="ef-titulo">
    <form class="hoja__in form" method="dialog" novalidate>
      <div class="hoja__cab"><h2 id="ef-titulo">Editar personaje</h2><button class="boton boton--fantasma boton--icono" type="button" data-cerrar aria-label="Cerrar"></button></div>
      <div class="retrato-carga">
        <div class="ficha__retrato" data-retrato></div>
        <div class="campo"><label for="ef-img">Retrato</label><input class="entrada" id="ef-img" type="file" accept="image/*"><button class="boton boton--fantasma boton--chico" type="button" data-quitar-img>Quitar imagen</button></div>
      </div>
      <div class="campo"><label for="ef-nombre">Nombre</label><input class="entrada" id="ef-nombre" name="nombre" required maxlength="80"></div>
      <div class="campo"><label for="ef-rol">Rol en la historia</label><input class="entrada" id="ef-rol" name="rol" maxlength="140"></div>
      <div class="fila">
        <div class="campo"><label for="ef-tipo">Tipo</label><select class="entrada" id="ef-tipo" name="tipo"><option value="pj">PJ</option><option value="npc">NPC</option><option value="enemigo">Enemigo</option></select></div>
        <div class="campo"><label for="ef-estado">Estado</label><select class="entrada" id="ef-estado" name="estado"><option value="activo">Activo</option><option value="derrotado">Derrotado</option><option value="muerto">Muerto</option><option value="desaparecido">Desaparecido</option></select></div>
      </div>
      <div class="fila">
        <div class="campo"><label for="ef-actitud">Actitud</label><select class="entrada" id="ef-actitud" name="actitud"><option>Amistoso</option><option>Indiferente</option><option>Hostil</option></select></div>
        <div class="campo"><label for="ef-nivel">Nivel</label><input class="entrada" id="ef-nivel" name="nivel" type="number" min="1" max="20"></div>
        <div class="campo"><label for="ef-pg">PG actuales</label><input class="entrada" id="ef-pg" name="pg" type="number" min="0" max="999"></div>
      </div>
      <div class="campo"><label for="ef-notas">Notas del DM</label><textarea class="entrada" id="ef-notas" name="notas" maxlength="4000"></textarea></div>
      <p class="aviso" role="alert"></p>
      <div class="hoja__pie"><button class="boton boton--secundario" type="button" data-cerrar-texto>Cancelar</button><button class="boton boton--primario" type="submit">Guardar</button></div>
    </form>
  </dialog>

  <!-- Nuevo personaje (DM) -->
  <dialog class="hoja" id="nuevo-pj" aria-labelledby="np-titulo">
    <form class="hoja__in form" method="dialog" novalidate>
      <div class="hoja__cab"><h2 id="np-titulo">Añadir a la campaña</h2><button class="boton boton--fantasma boton--icono" type="button" data-cerrar aria-label="Cerrar"></button></div>
      <div class="segmento" role="group" aria-label="Cómo crearlo" data-modo-np>
        <button type="button" aria-pressed="true" data-modo="forjar">Forjar NPC</button>
        <button type="button" aria-pressed="false" data-modo="bestiario">Desde el bestiario</button>
      </div>
      <div class="form" data-np="forjar">
        <div class="campo"><label for="np-nombre">Nombre <span class="suave">(vacío = al azar)</span></label><input class="entrada" id="np-nombre" name="nombre" maxlength="80"></div>
        <div class="fila">
          <div class="campo"><label for="np-tipo">Tipo</label><select class="entrada" id="np-tipo" name="tipo"><option value="npc">NPC</option><option value="enemigo">Enemigo</option><option value="pj">PJ</option></select></div>
          <div class="campo"><label for="np-nivel">Nivel</label><input class="entrada" id="np-nivel" name="nivel" type="number" min="1" max="20" value="1"></div>
        </div>
        <div class="fila">
          <div class="campo"><label for="np-raza">Especie</label><select class="entrada" id="np-raza" name="raza"></select></div>
          <div class="campo"><label for="np-clase">Clase</label><select class="entrada" id="np-clase" name="clase"></select></div>
        </div>
        <div class="campo"><label for="np-rol">Rol en la historia</label><input class="entrada" id="np-rol" name="rol" maxlength="140"></div>
      </div>
      <div class="form" data-np="bestiario" hidden>
        <div class="campo"><label for="np-criatura">Criatura</label><select class="entrada" id="np-criatura" name="criatura"></select></div>
        <div class="campo"><label for="np-cnombre">Nombre en la campaña <span class="suave">(opcional)</span></label><input class="entrada" id="np-cnombre" name="cnombre" maxlength="80"></div>
      </div>
      <p class="aviso" role="alert"></p>
      <div class="hoja__pie"><button class="boton boton--secundario" type="button" data-cerrar-texto>Cancelar</button><button class="boton boton--primario" type="submit">Añadir</button></div>
    </form>
  </dialog>

  <!-- Editar campaña -->
  <dialog class="hoja" id="editar" aria-labelledby="editar-titulo">
    <form class="hoja__in form" method="dialog" novalidate>
      <div class="hoja__cab"><h2 id="editar-titulo">Editar campaña</h2><button class="boton boton--fantasma boton--icono" type="button" data-cerrar aria-label="Cerrar"></button></div>
      <div class="campo"><label for="ed-nombre">Nombre</label><input class="entrada" id="ed-nombre" name="nombre" required minlength="2" maxlength="80"></div>
      <div class="campo"><label for="ed-amb">Ambientación</label><input class="entrada" id="ed-amb" name="ambientacion" maxlength="120"></div>
      <div class="campo"><label for="ed-sin">De qué va</label><textarea class="entrada" id="ed-sin" name="sinopsis" maxlength="1200"></textarea></div>
      <div class="campo"><label for="ed-clave">Nueva contraseña para unirse</label><input class="entrada" id="ed-clave" name="clave" type="text" autocomplete="off" minlength="4" maxlength="100"><span class="ayuda">Déjala vacía para mantener la actual.</span></div>
      <p class="aviso" role="alert"></p>
      <div class="hoja__pie"><button class="boton boton--secundario" type="button" data-cerrar-texto>Cancelar</button><button class="boton boton--primario" type="submit">Guardar</button></div>
    </form>
  </dialog>

  <script src="js/campana.js"></script>
</body>
</html>
