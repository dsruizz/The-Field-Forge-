services:
  web:
    image: nginx:alpine
    container_name: dnd-web
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - forja
    networks:
      - dnd
      - dsruiz-proxy
    restart: unless-stopped

  # Salas de juego: jugadores en el móvil, peticiones al DM y guardado compartido.
  api:
    image: node:22-alpine
    container_name: dnd-api
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - DATA_DIR=/data
      # Descomenta para exigir una clave al crear salas:
      # - TFF_CLAVE_CREAR=pon-aqui-una-clave
    volumes:
      - ./server:/app:ro
      - ./data:/data
    networks:
      - dnd
    restart: unless-stopped

  # Versión nueva (v2): cuentas, campañas y web nueva en /v2/. Base de datos en ./data-v2/forge.db
  forja:
    image: node:22-alpine
    container_name: dnd-forja
    working_dir: /app
    command: ["node", "--disable-warning=ExperimentalWarning", "server.js"]
    environment:
      - DATA_DIR=/data
      - PUBLIC_DIR=/public
      - TFF_BASE=/
      - TFF_MAX_USUARIOS=10
      # Si prefieres fijar tú el código de invitación:
      # - TFF_INVITACION=FORJA-XXXX
    volumes:
      - ./v2/server:/app:ro
      - ./v2/public:/public:ro
      - ./data-v2:/data
    networks:
      - dnd
    restart: unless-stopped

networks:
  dnd:
    driver: bridge

  dsruiz-proxy:
    external: true
