# The Field Forge
#   /           → versión principal (servicio forja: web + API de cuentas y campañas)
#   /clasica/   → herramienta de mesa anterior (mapa, proyector, sala de móviles)
#   /api/salas  → servidor de salas de la herramienta de mesa
server {
  listen 80;
  server_name _;
  client_max_body_size 120m;

  # Herramienta de mesa (estática).
  location = /clasica { return 301 /clasica/; }
  location /clasica/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ =404;
  }

  # Las URLs antiguas de la herramienta de mesa siguen funcionando.
  location ~ ^/(mapas|jugar)\.html$ { return 302 /clasica$request_uri; }

  # API de salas (Node). SSE necesita la conexión abierta y sin búfer.
  location /api/salas {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # La versión de prueba en /v2/ pasa a la raíz.
  location /v2/ { rewrite ^/v2/(.*)$ /$1 permanent; }

  # Todo lo demás: versión principal.
  location / {
    proxy_pass http://forja:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
  }
}
